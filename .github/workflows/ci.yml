name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Measure fresh-process rendering (no cross-request cache)
        run: npm run bench:cold
      - name: Compare fresh renders with the published 0.2.1 baseline
        if: matrix.node == '24'
        env:
          BENCH_ROUNDS: '3'
          BENCH_OUTPUT: cold-comparison.json
        run: |
          baseline=$(mktemp -d)
          npm pack @lofcz/tikz@0.2.1 --ignore-scripts --pack-destination "$baseline"
          tar -xzf "$baseline/lofcz-tikz-0.2.1.tgz" -C "$baseline"
          node benchmarks/cold.mjs "$baseline/package" .
          node benchmarks/index.mjs
      - uses: actions/upload-artifact@v7
        if: matrix.node == '24'
        with:
          name: cold-render-comparison
          path: cold-comparison.json
